[project]
name = "ppdb"
dynamic = ["version"]
description = "Import and export Portfolio Performance XML files to/from a SQLite or PostgreSQL database"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
pgsql = [
    "psycopg[binary]>=3.1",
]

[project.scripts]
ppdb-init = "ppdb_init:main"
ppdb-import = "ppdb_import:main"
ppdb-export = "ppdb_export:main"
ppxml2db = "ppdb_shim:main"
ppxml2db-init = "ppdb_shim:init_main"
db2ppxml = "ppdb_shim:export_main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["schema"]
py-modules = ["ppdb_import", "ppdb_export", "ppdb_init", "ppdb_shim", "dbhelper", "version"]

[tool.setuptools.package-data]
schema = ["*.sql"]

[tool.setuptools.dynamic]
version = { attr = "version.__version__" }
